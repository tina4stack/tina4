# Tina4 nginx server block — generated by `tina4 deploy nginx`.
# Reverse-proxies to the framework process. Static files are served by
# Tina4 itself; nginx only handles TLS termination + proxy + gzip.

server {
    listen 80;
    server_name {{PROJECT}}.example.com;

    # Recommended: redirect to HTTPS once you have a cert.
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:7146;   # adjust port per language
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / SSE pass-through.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 24h;
    }

    # Optional: gzip for HTML/JSON. Disable on already-compressed types.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}

