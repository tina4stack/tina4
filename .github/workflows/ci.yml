name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - name: Install cargo-deny
        uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2.82.5
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      # Audit every locked crate, including optional crates outside the active graph.
      - run: cargo audit --deny unsound --deny yanked
      - run: cargo deny --locked check advisories bans sources licenses
      - run: cargo check
      - run: cargo test
      - run: cargo clippy -- -D warnings
      - run: python3 scripts/release-inventory.py --output target/release-inventory
      - run: python3 tests/release_integrity.py

  skills-installer:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            kind: shell
          - os: windows-latest
            kind: powershell
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Exercise installer retries and fallback
        run: python tests/skills_installer_http.py ${{ matrix.kind }}
      - name: Verify canonical PowerShell installer signature
        if: matrix.kind == 'powershell'
        shell: powershell
        run: |
          $local = Get-AuthenticodeSignature .\install-skills.ps1
          if ($local.Status -ne 'Valid') {
            throw "Checked-out installer signature is $($local.Status): $($local.StatusMessage)"
          }

          $raw = Join-Path $env:RUNNER_TEMP 'install-skills-raw.ps1'
          Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/tina4stack/tina4/$env:GITHUB_SHA/install-skills.ps1" -OutFile $raw
          $hosted = Get-AuthenticodeSignature $raw
          if ($hosted.Status -ne 'Valid') {
            throw "GitHub Raw installer signature is $($hosted.Status): $($hosted.StatusMessage)"
          }
