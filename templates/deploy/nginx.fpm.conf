# nginx in front of php-fpm for a Tina4 PHP app.
# Generated by `tina4 deploy docker --runtime fpm`.

server {
    listen 7145 default_server;
    server_name _;

    root /app;
    index index.php;

    # Tina4 is a front-controller framework: every path that is not a real
    # file on disk is a ROUTE, and index.php decides what it means. Without
    # this, anything but "/" returns nginx's own 404 and the router never runs.
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Long-running routes (a report, an upload, an external API call) must
        # not be cut off at nginx's 60s default while php-fpm is still working.
        fastcgi_read_timeout 300;
    }

    # Never serve the environment file, the VCS directory, or anything else
    # dot-prefixed. A single misconfigured location here leaks TINA4_SECRET
    # and every database credential the app has.
    location ~ /\. {
        deny all;
        return 404;
    }

    # Nor the dependency tree or the app's own source directories, which are
    # under the document root only because the framework needs them there.
    location ~ ^/(vendor|migrations|tests)/ {
        deny all;
        return 404;
    }

    client_max_body_size 20M;

    access_log /dev/stdout;
    error_log  /dev/stderr;
}
