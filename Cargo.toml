[package]
name = "tina4"
version = "3.8.83"
edition = "2021"
description = "Tina4 — Unified CLI for Python, PHP, Ruby, and Node.js frameworks"
license = "MIT"
repository = "https://github.com/tina4stack/tina4"
homepage = "https://tina4.com"
keywords = ["cli", "web-framework", "scss", "dev-tools"]
categories = ["command-line-utilities", "development-tools", "web-programming"]

# Debian/Ubuntu packaging (cargo-deb). Produces tina4_<version>_<arch>.deb from
# THIS manifest - one source of truth for version + description. The release
# pipeline runs `cargo deb --no-build --target <triple>` after the normal build,
# so the binary is reused (never recompiled) and the arch is taken from the
# target triple. `target/release/...` below is auto-substituted with the
# per-target directory when --target is passed. Baseline channel: the .deb is
# attached to each GitHub Release for `apt install ./tina4_x.y.z_amd64.deb`.
# A hosted apt.tina4.com repo (true `apt-get install tina4`) is a documented
# follow-up - see packaging/README.md.
[package.metadata.deb]
maintainer = "Tina4 Stack <info@tina4.com>"
copyright = "2026, Tina4 Stack <info@tina4.com>"
license-file = ["LICENSE", "0"]
section = "devel"
priority = "optional"
# We ship the glibc build in the .deb (not the static musl one). A Rust glibc
# binary's only runtime dependency is libc6; pin it explicitly rather than using
# "$auto" so packaging the arm64 .deb on an amd64 CI runner needs no cross-arch
# dpkg-shlibdeps resolution.
depends = "libc6"
extended-description = """\
The Tina4 CLI is one command for the whole Tina4 framework family (Python, PHP, \
Ruby, Node.js): scaffold a project, run a hot-reloading dev server, generate \
models and routes, run migrations, and measure code health - all from `tina4`."""
assets = [
    ["target/release/tina4", "usr/bin/tina4", "755"],
    ["LICENSE", "usr/share/doc/tina4/copyright", "644"],
    ["README.md", "usr/share/doc/tina4/README.md", "644"],
]

[[bin]]
name = "tina4"
path = "src/main.rs"

[dependencies]
grass = { version = "0.13", default-features = false }
notify = "7"
clap = { version = "4", features = ["derive"] }
colored = "2"
which = "7"
# "termination" makes set_handler also catch SIGTERM and SIGHUP (not just
# SIGINT) on Unix, plus CTRL_CLOSE / LOGOFF / SHUTDOWN on Windows. The dev
# server child sits in its own process group, so without this a `kill` or a
# closed terminal would leave the npx -> tsx -> node tree orphaned.
ctrlc = { version = "3", features = ["termination"] }
# rustls-tls keeps the build cross-compilable to aarch64-unknown-linux-gnu
# without a system OpenSSL install. Default native-tls path pulls
# openssl-sys which can't find /usr/include/openssl on cross-compile
# (see v3.8.27 release CI). Pure-Rust TLS works on every target we ship.
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.26"
tree-sitter-python = "0.25"
tree-sitter-php = "0.24"
tree-sitter-ruby = "0.23"
tree-sitter-typescript = "0.23"
# Rust itself. Until this landed the metrics engine could not measure its own
# implementation language — `tina4 metrics` on this repo saw zero files.
tree-sitter-rust = "0.24"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1

# Lints that are cosmetic-only (rustdoc list formatting in agent.rs's
# extensive prose docs) or that flag pub-API fields/fns kept for
# downstream callers (WriteStats, SearchResp.query, compose_commit_message).
# Everything bug-shaped stays a hard error via `cargo clippy -- -D warnings`
# in CI — these allow-list entries only mute the noise we've audited.
# stable-as-of-rust 1.96.0; older clippy doesn't know some of these names
# (it just ignores unknown lint names so this is portable).
[lints.clippy]
doc_overindented_list_items = "allow"
doc_lazy_continuation = "allow"
# Style: a single sort_by call with custom logic reads cleaner than
# sort_by_key + a separate closure for our one-off use in session.rs.
unnecessary_sort_by = "allow"
# Style: the match arm contains a guard expression; rewriting as an
# inner match would split the logic across two structures.
collapsible_match = "allow"

[lints.rust]
dead_code = "allow"
